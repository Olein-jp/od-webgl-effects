name: Check and release

on:
  push:
    branches: ['**']
    tags: ['*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2, wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction
      - run: composer lint
      - run: php -l od-webgl-effects.php
      - name: Build translations
        run: |
          wp i18n make-pot . languages/od-webgl-effects.pot --domain=od-webgl-effects --exclude=vendor,node_modules,dist
          wp i18n make-mo languages
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Build and verify distribution
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/package.py "$REF_NAME"
          else
            npm run package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: od-webgl-effects
          path: dist/od-webgl-effects.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: od-webgl-effects
          path: dist
      - name: Publish release after uploading package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/od-webgl-effects.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
